---
layout: default
---
<p class="back"><a href="/">Home</a></p>
<article>
  <h1>{{ page.title }}</h1>
  <p class="date">{{ page.date | date: "%b %d, %Y" }}</p>
  {% if page.tag %}<p class="tag">{{ page.tag }}</p>{% endif %}
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  {% if page.image %}<img class="banner" src="{{ page.image }}" alt="">{% endif %}
  {{ content }}
</article>
